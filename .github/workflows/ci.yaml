name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # build.py needs 3.12 (f-string syntax); node is preinstalled on the
      # runner and used by test_aws.py to execute the generated JS.
      - name: Build site
        run: python3 deploy/build.py dist

      - name: Generate edge script
        run: python3 deploy/edge_script.py dist

      - name: Run tests
        run: python3 -m unittest discover -s deploy -p "test_*.py" -v
